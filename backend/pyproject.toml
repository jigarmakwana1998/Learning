[project]
name = "learning-coach-api"
version = "0.4.0"
description = "Learning Coach API"
requires-python = ">=3.12"
dependencies = [
    "browser-mcp",
    "course-mcp",
    "cryptography>=50,<51",
    "deepagents>=0.5.4,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-litellm>=0.4,<1",
    "langchain-mcp-adapters>=0.2,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "langgraph-checkpoint-sqlite>=3,<4",
    "learning-coach-db",
    # browser-mcp needs mcp<2; litellm>=1.103 needs mcp 2.
    "litellm>=1.95,<1.103",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[tool.uv.sources]
browser-mcp = { workspace = true }
course-mcp = { workspace = true }
learning-coach-db = { workspace = true }
