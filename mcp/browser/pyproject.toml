[project]
name = "browser-mcp"
version = "0.1.0"
description = "Restricted public-web browser MCP server: SearXNG search and hardened Chrome page reads"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2.3,<3",
]

[project.scripts]
browser-mcp = "browser_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_mcp"]
