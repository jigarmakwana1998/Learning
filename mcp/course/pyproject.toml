[project]
name = "course-mcp"
version = "0.1.0"
description = "Course MCP server: a research run's source pages, the course outline and cited sections"
requires-python = ">=3.12"
dependencies = [
    "learning-coach-db",
    # The server is written against the FastMCP 1.x API (mcp.server.fastmcp).
    "mcp>=1.28.1,<2",
    "pydantic>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
course-mcp = "course_mcp.server:main"

[tool.uv.sources]
learning-coach-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["course_mcp"]
