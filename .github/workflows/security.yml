name: Security

on:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: SAST and project boundary rules
        run: |
          # Semgrep 1.136 imports pkg_resources, removed from setuptools 81+.
          python -m pip install "setuptools<81" "semgrep==1.136.0" "bandit==1.8.3" "pip-audit==2.9.0" "uv==0.11.7"
          semgrep scan --config p/python --config .semgrep/agent-boundaries.yml --error
          bandit --recursive backend/app database/learning_db mcp/browser/browser_mcp --severity-level medium --confidence-level medium
          uv export --frozen --no-dev --no-emit-workspace --no-hashes --output-file /tmp/requirements.txt
          pip-audit --requirement /tmp/requirements.txt
      - name: Gitleaks current revision
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: TruffleHog full history nightly / PR range otherwise
        run: |
          python -m pip install "trufflehog==2.2.1"
          findings="$(trufflehog --json --regex --entropy=True "file://$PWD")"
          test -z "$findings"
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate browser-enabled Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          LITELLM_MASTER_KEY: sk-ci
          NVIDIA_API_KEY: ci-nvidia-key
          SEARXNG_SECRET: ci-searxng-secret
        run: |
          cp backend/.env.example backend/.env
          docker compose -f compose.yml config --quiet
      - name: Enforce a digest-pinned non-root Dockerfile
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < backend/Dockerfile
          grep -Eq '^FROM .+@sha256:[a-f0-9]{64}$' backend/Dockerfile
      - name: Build and scan image for high and critical CVEs
        run: |
          docker build --file backend/Dockerfile --tag learning-coach:security .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.2 image --severity HIGH,CRITICAL learning-coach:security
