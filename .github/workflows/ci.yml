name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-24.04
    env:
      # Real project for the live auth contract tests; the rest of the suite uses a fake.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.11.7
      # One uv workspace: backend, database and the mcp/ servers share uv.lock.
      - run: uv sync --frozen
      # Existing style debt is addressed separately; enforce correctness and
      # security-oriented lint rules for new CI failures in the meantime.
      - run: uv run ruff check backend database mcp --ignore E501,E701,E702,B008,I001,UP017
      # The SQLite-backed tests share one database file; running them in
      # parallel races application startup and table creation.
      - run: uv run pytest --testmon -q --benchmark-disable --cov=app --cov=learning_db --cov=browser_mcp --cov=course_mcp --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: backend-coverage, path: coverage.xml, if-no-files-found: warn }
  mobile:
    name: Mobile type check
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
