name: Migration check

on:
  pull_request:
    paths: ["database/**"]

permissions:
  contents: read

jobs:
  upgrade-and-downgrade:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: learning_coach, POSTGRES_USER: learning_coach, POSTGRES_PASSWORD: learning_coach }
        options: >-
          --health-cmd "pg_isready -U learning_coach -d learning_coach" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    defaults:
      run: { working-directory: database }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python -m pip install uv==0.11.7 && uv sync --frozen --package learning-coach-db
      - env:
          DATABASE_URL: postgresql+asyncpg://learning_coach:learning_coach@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/learning_coach
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
