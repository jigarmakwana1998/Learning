name: Eval regression

on:
  pull_request:
    paths: ["backend/app/agents/**", "backend/evaluations/**", "backend/app/harness/**"]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-baseline:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - name: Verify deterministic golden baseline
        run: |
          test -f evaluations/golden-baseline.json
          python scripts/check_eval_regression.py --baseline evaluations/golden-baseline.json --fixtures evaluations/fixtures.json
