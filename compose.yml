name: learning-coach

# Local Docker-first stack: api, web, litellm, postgres behind Caddy. Only Caddy
# publishes a host port. Add services here when the app actually needs them.
# Watch everything with: docker compose logs -f
# Replace image tags with immutable digests before deploying to staging/production.

x-logging: &logging
  # Rotate so DEBUG output cannot fill the disk.
  options: {max-size: "20m", max-file: "5"}

services:
  reverse-proxy:
    image: caddy:2.8.4-alpine
    user: "10001:10001"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 128m
    cpus: "0.25"
    networks: [edge, internal]
    logging: *logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://learning_coach:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/learning_coach
      AGENT_BROWSER_CONTENT_BOUNDARIES: "1"
      AGENT_BROWSER_MAX_OUTPUT: "6000"
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-medium}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      AGENT_CHECKPOINT_DATABASE_URL: postgresql://learning_coach:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/learning_coach
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_MODEL: ${LITELLM_MODEL:-agent-model}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      SEARXNG_URL: http://searxng:8080
    depends_on:
      litellm:
        condition: service_healthy
      searxng:
        condition: service_started
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=256m
      - /dev/shm:uid=10001,gid=10001,mode=1777,size=512m
      - /home/app/.cache:uid=10001,gid=10001,mode=0700,size=1g
      - /home/app/.agent-browser:uid=10001,gid=10001,mode=0700,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "command -v agent-browser >/dev/null && agent-browser --version >/dev/null && python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # edge provides outbound Internet access for public browsing;
    # databases remain isolated on internal and publish no host ports.
    networks: [edge, internal]
    logging: *logging
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.0@sha256:2e4c0371f3a8c28e4da131d77abaa8341cd3b0c2fcc4d34d7c5900431af7b9d0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://learning_coach:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/learning_coach
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?Set NVIDIA_API_KEY in .env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      LITELLM_LOG: ${LOG_LEVEL:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 512m
    cpus: "0.75"
    networks: [edge, internal]
    logging: *logging
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./infra/searxng:/etc/searxng:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/searxng
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: "0.5"
    # edge for outbound queries to search engines; internal so only the API reaches it.
    networks: [edge, internal]
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: /api
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"
    networks: [edge]
    logging: *logging
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: learning_coach
      POSTGRES_USER: learning_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_coach -d learning_coach"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    logging: *logging
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
