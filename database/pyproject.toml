[project]
name = "learning-coach-db"
version = "0.1.0"
description = "Learning Coach database models, session, and Alembic migrations"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learning_db"]
