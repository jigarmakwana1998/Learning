# Every live agent call targets the stable `agent-model` alias below. Change only
# this mapping (and its provider secret) to swap LLMs without application changes.
# Keep provider keys in the environment; this file contains no secrets.
# Both deployments share the alias so trace keys scoped to `agent-model` reach
# either; `order` prefers OpenRouter's free MiniMax and falls back to NVIDIA GLM
# while MiniMax is cooling down after rate-limit or provider errors.
model_list:
  - model_name: agent-model
    litellm_params:
      model: openrouter/minimax/minimax-m3.1-flash:free
      api_key: os.environ/OPENROUTER_API_KEY
      order: 1
    model_info:
      max_input_tokens: 1000000
      supports_function_calling: true
  - model_name: agent-model
    litellm_params:
      model: openai/z-ai/glm-5.3-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      order: 2
    model_info:
      max_input_tokens: 1048576
      supports_function_calling: true

litellm_settings:
  json_logs: true

router_settings:
  num_retries: 2
  allowed_fails: 1
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: true
